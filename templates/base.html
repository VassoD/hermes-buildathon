<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Support Crew{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a class="brand" href="{{ url_for('index') }}">Support Crew<span class="brand-suffix">Agency console</span></a>
      <nav class="top-nav">
        <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint in ('index', 'customer_detail', 'ticket_detail') }}">Briefing</a>
        <a href="{{ url_for('overview') }}" class="{{ 'active' if request.endpoint == 'overview' }}">Vue d'ensemble</a>
        <a href="{{ url_for('workspace_setup') }}" class="{{ 'active' if request.endpoint == 'workspace_setup' }}">Workspace</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
